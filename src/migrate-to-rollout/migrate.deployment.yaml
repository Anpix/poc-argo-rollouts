apiVersion: apps/v1
kind: Deployment
metadata:
  name: migrate
  namespace: poc-rollouts
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: migrate
      namespace: poc-rollouts
  template:
    metadata:
      labels:
        app: migrate
        namespace: poc-rollouts
    spec:
      containers:
        - name: migrate
          image: argoproj/rollouts-demo:blue
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: 32Mi
              cpu: 5m
---
apiVersion: v1
kind: Service
metadata:
  name: migrate
  namespace: poc-rollouts
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: migrate
    namespace: poc-rollouts
