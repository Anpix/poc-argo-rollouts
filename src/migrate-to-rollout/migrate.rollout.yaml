apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: migrate
  namespace: poc-rollouts
spec:
  replicas: 5
  selector:
    matchLabels:
      app: migrate
      namespace: poc-rollouts
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: migrate
    scaleDown: onsuccess
  strategy:
    blueGreen:
      activeService: migrate
      previewService: migrate-preview
---
apiVersion: v1
kind: Service
metadata:
  name: migrate-preview
  namespace: poc-rollouts
spec:
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: migrate
    namespace: poc-rollouts
