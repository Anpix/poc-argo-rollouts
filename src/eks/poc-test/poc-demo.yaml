apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: poc-demo
  namespace: load-test
spec:
  replicas: 5
  strategy:
    blueGreen:
      activeService: poc-demo
      previewService: poc-demo-preview
      prePromotionAnalysis:
        templates:
          - templateName: smoke-tests
        args:
          - name: service-name
            value: poc-demo-preview.load-test.svc.cluster.local
      postPromotionAnalysis:
        templates:
          - templateName: smoke-tests
        args:
          - name: service-name
            value: poc-demo-preview.load-test.svc.cluster.local
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: poc-demo
      namespace: load-test
  template:
    metadata:
      labels:
        app: poc-demo
        namespace: load-test
    spec:
      containers:
        - name: poc-demo
          image: python:3.12-alpine
          command: ['/bin/sh', '-c']
          args:
            - |
              mkdir -p /www
              (sleep 10 && touch /www/ready) &
              exec python3 - <<'PY'
              import http.server
              import json
              import os
              import time
              from datetime import datetime, timezone
              from urllib.parse import parse_qs, urlparse

              class Handler(http.server.BaseHTTPRequestHandler):
                  # HTTP/1.1 keeps the connection open between requests, like Kestrel in prod;
                  # HTTP/1.0 (the Python default) closes it after each response. With keep-alive
                  # every response needs a Content-Length, or the client waits for the close.
                  protocol_version = 'HTTP/1.1' if os.environ.get('KEEP_ALIVE') == 'true' else 'HTTP/1.0'

                  def do_GET(self):
                      # ALB health check, same answer as api-7vote in prod: 200, empty body, no cache
                      if self.path == '/_Healthcheck/balancer':
                          self.send_response(200)
                          self.send_header('Cache-Control', 'no-store, no-cache')
                          self.send_header('Content-Length', '0')
                          self.end_headers()
                          return
                      # used only by the smoke-tests AnalysisTemplate, 503 for the first 10s
                      if self.path == '/ready':
                          code = 200 if os.path.exists('/www/ready') else 503
                          self.send_response(code)
                          self.send_header('Content-Length', '0')
                          self.end_headers()
                          return
                      # ?delay=<ms> holds the response, to keep requests in flight during a promotion
                      try:
                          delay_ms = int(parse_qs(urlparse(self.path).query).get('delay', ['0'])[0])
                      except ValueError:
                          self.send_response(400)
                          self.send_header('Content-Length', '0')
                          self.end_headers()
                          return
                      time.sleep(max(delay_ms, 0) / 1000)
                      body = json.dumps({
                          'version': os.environ.get('APP_VERSION'),
                          'pod': os.environ.get('POD_NAME'),
                          'timestamp': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z',
                      }).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, format, *args):
                      pass

              # threaded, so concurrent requests don't wait in line
              http.server.ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
              PY
          env:
            - name: APP_VERSION
              value: 'blue'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 'true' keeps connections open between requests (HTTP/1.1), same as api-7vote in prod
            - name: KEEP_ALIVE
              value: 'true'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # No readinessProbe, same as api-7vote in prod: the pod is Ready as
          # soon as the container starts.
          resources:
            requests:
              memory: 32Mi
              cpu: 5m
---
# Same as api-7vote in prod: NodePort behind the ALB (target-type instance).
apiVersion: v1
kind: Service
metadata:
  name: poc-demo
  namespace: load-test
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: poc-demo
    namespace: load-test
---
# Same as blue-api-7vote in prod: ClusterIP, reachable only inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: poc-demo-preview
  namespace: load-test
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: poc-demo
    namespace: load-test
---
# ALB with the same settings as the api-7vote Ingress in prod (IngressGroup
# "igrejas"). Differences: HTTP:80 only (the POC has no domain nor ACM
# certificate, so no HTTPS listener/ssl-redirect), no host in the rule, and no
# target-node-labels (the POC has no Karpenter node pools).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-demo
  namespace: load-test
  annotations:
    alb.ingress.kubernetes.io/group.name: poc
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /_Healthcheck/balancer
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '5'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '2'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poc-demo
                port:
                  number: 80
