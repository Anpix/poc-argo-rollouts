apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: deployment-demo
  namespace: load-test
spec:
  replicas: 5
  strategy:
    blueGreen:
      activeService: deployment-demo
      previewService: deployment-demo-preview
      prePromotionAnalysis:
        templates:
          - templateName: smoke-tests
        args:
          - name: service-name
            value: deployment-demo-preview.load-test.svc.cluster.local:7002
      postPromotionAnalysis:
        templates:
          - templateName: smoke-tests
        args:
          - name: service-name
            value: deployment-demo-preview.load-test.svc.cluster.local:7002
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: deployment-demo
      namespace: load-test
  template:
    metadata:
      labels:
        app: deployment-demo
        namespace: load-test
    spec:
      containers:
        - name: deployment-demo
          image: python:3.12-alpine
          command: ['/bin/sh', '-c']
          args:
            - |
              mkdir -p /www
              (sleep 10 && touch /www/ready) &
              exec python3 - <<'PY'
              import http.server
              import json
              import os
              from datetime import datetime, timezone

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == '/ready':
                          code = 200 if os.path.exists('/www/ready') else 503
                          self.send_response(code)
                          self.end_headers()
                          return
                      body = json.dumps({
                          'version': os.environ.get('APP_VERSION'),
                          'pod': os.environ.get('POD_NAME'),
                          'timestamp': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z',
                      }).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, format, *args):
                      pass

              http.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
              PY
          env:
            - name: APP_VERSION
              value: 'blue'
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              memory: 32Mi
              cpu: 5m
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-demo
  namespace: load-test
spec:
  type: LoadBalancer
  ports:
    - port: 7001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: deployment-demo
    namespace: load-test
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-demo-preview
  namespace: load-test
spec:
  type: LoadBalancer
  ports:
    - port: 7002
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: deployment-demo
    namespace: load-test
